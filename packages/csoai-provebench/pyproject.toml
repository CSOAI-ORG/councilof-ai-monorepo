[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csoai-provebench"
version = "0.1.0"
description = "GSPC-axis benchmark tasks: govbench / provbench / ossbench / mcpbench / pqcbench / defbench"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Nicholas Templeman"}]
classifiers = [
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["csoai_provebench*"]
