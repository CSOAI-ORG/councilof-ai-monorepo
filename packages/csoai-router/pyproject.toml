[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csoai-router"
version = "0.1.0"
description = "Routing + fleet + cluster orchestration: sov4_router, orchestrator, swarm, master_hives, owem_cluster"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Nicholas Templeman"}]
dependencies = ["requests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["csoai_router*"]
