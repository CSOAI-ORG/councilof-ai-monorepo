[project]
name = "sovos"
version = "0.1.0"
description = "SOVOS - Sovereign Operating System for AI Governance. GSPC four-axis scoring over ETSI EN 304 223."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
sovos = "sovos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sovos"]
